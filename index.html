<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physical Stock Taking</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,system-ui,sans-serif;
  background:#f3f4f6;color:#1f2937
}
.container{
  max-width:1100px;
  margin:2.5rem auto;
  padding:0 1rem
}

/* HEADER */
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:2rem
}
.page-header h1{
  font-size:1.8rem;
  font-weight:700
}
.add-btn{
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:1.5rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center
}
.add-btn:hover{background:#15803d}

/* CARD */
.card{
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding:1.25rem;
  margin-bottom:1.25rem
}

/* TOP ROW */
.card-header{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:1rem;
  align-items:center
}
.field label{
  font-size:.75rem;
  color:#6b7280;
  text-transform:uppercase;
  letter-spacing:.05em
}
.field p{
  font-weight:600;
  margin-top:.2rem
}

/* BUTTON */
.toggle-btn{
  background:#3b82f6;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:.5rem .9rem;
  cursor:pointer;
  white-space:nowrap
}
.toggle-btn:hover{background:#2563eb}

/* DIVIDER */
.divider{
  height:1px;
  background:#e5e7eb;
  margin:1rem 0
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
  margin-top:.5rem
}
.table th,.table td{
  border:1px solid #e5e7eb;
  padding:.5rem;
  text-align:center;
  font-size:.9rem
}
.table th{
  background:#f9fafb;
  font-weight:600
}

.hidden{display:none}

/* RESPONSIVE */
@media(max-width:768px){
  .card-header{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Physical Stock Taking</h1>
    <button class="add-btn" title="New Physical Stock Taking"
      onclick="window.location.href='new-physicalstock.html'">+</button>
  </div>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script>
/* ================= CONFIG ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycby9MB_9Crr2vS1oj3YLbCc0D76JX1-YWlRN9FtgfjyIqTxLesHfDpYgc7jzAHG0-eQpoA/exec';

/* ================= HELPERS ================= */
function parseStock(str) {
  return str.replaceAll('),(', ')|(')
    .replaceAll('(', '')
    .replaceAll(')', '')
    .split('|')
    .map(s => {
      const [code, unit, qty] = s.split(',');
      return { code, unit, qty };
    });
}

function toggle(id) {
  document.getElementById(id).classList.toggle('hidden');
}

/* ================= LOAD LIST ================= */
async function loadList() {
  const res = await fetch(API_URL);
  const records = await res.json();
  const list = document.getElementById('list');

  list.innerHTML = '';

  records.forEach((r, i) => {
    const items = parseStock(r.Text4);
    const tableId = `items_${i}`;

    list.innerHTML += `
      <div class="card">
        <div class="card-header">
          <div class="field">
            <label>Date</label>
            <p>${r.Text1}</p>
          </div>

          <div class="field">
            <label>Division</label>
            <p>${r.Text2}</p>
          </div>

          <div class="field">
            <label>Location</label>
            <p>${r.Text3}</p>
          </div>

          <button class="toggle-btn" onclick="toggle('${tableId}')">
            View Items
          </button>
        </div>

        <div id="${tableId}" class="hidden">
          <div class="divider"></div>
          <table class="table">
            <thead>
              <tr>
                <th>Item Code</th>
                <th>Unit</th>
                <th>Qty</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => `
                <tr>
                  <td>${it.code}</td>
                  <td>${it.unit}</td>
                  <td>${it.qty}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  });
}

document.addEventListener('DOMContentLoaded', loadList);
</script>

</body>
</html>
