<!DOCTYPE html>
<html>
<head>
  <title>Google Auth Test</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 12px 24px; margin: 10px; cursor: pointer; border: none; border-radius: 6px; font-size: 16px; }
    .google-btn { background: #4285f4; color: white; }
    .test-btn { background: #34a853; color: white; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow: auto; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; margin: 20px 0; }
    .success { color: #0a7e3a; background: #e6f4ea; padding: 10px; border-radius: 5px; }
    .error { color: #a50e0e; background: #fce8e8; padding: 10px; border-radius: 5px; }
    .info { color: #0766a5; background: #e5f0fa; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🔐 Google Authentication Test</h1>
  <p>Hosted on: <strong>GitHub Pages</strong></p>
  
  <div class="card">
    <h3>Step 1: Sign in with Google</h3>
    <button class="google-btn" onclick="signInWithGoogle()">Sign in with Google</button>
    <p><small>Opens Google sign-in page in a new tab</small></p>
  </div>

  <div class="card">
    <h3>Step 2: Test Authentication</h3>
    <button class="test-btn" onclick="testAuth()">Test My Login Status</button>
    <p><small>After signing in, click here to check</small></p>
  </div>

  <div id="status"></div>
  <h3>Response:</h3>
  <pre id="result">Click test to check status</pre>

  <script>
    // Replace with your actual Apps Script URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbySJabN1Dd8pNegQlFjMbzXlh6bQ61VP0-SGZFM6qn7us1Ydd9x_3rAJw5NYJ9H57Q9Kw/exec';
    
    function signInWithGoogle() {
      // Open Google sign in
      window.open('https://accounts.google.com/Login', '_blank');
      alert('1. Sign in with Google\n2. Then come back and click "Test My Login Status"');
    }
    
    async function testAuth() {
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');
      
      statusDiv.innerHTML = '<div class="info">⏳ Checking authentication...</div>';
      resultDiv.textContent = 'Loading...';
      
      try {
        // Use JSONP approach for GitHub Pages
        const callbackName = 'jsonp_callback_' + Date.now();
        
        const jsonpPromise = new Promise((resolve, reject) => {
          window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            resolve(data);
          };
          
          const script = document.createElement('script');
          script.src = API_URL + '?callback=' + callbackName + '&t=' + Date.now();
          script.onerror = reject;
          document.body.appendChild(script);
          
          // Timeout after 5 seconds
          setTimeout(() => reject(new Error('Timeout')), 5000);
        });
        
        const data = await jsonpPromise;
        console.log('Response:', data);
        
        resultDiv.textContent = JSON.stringify(data, null, 2);
        
        if (data.email && data.isLoggedIn) {
          statusDiv.innerHTML = `<div class="success">✅ Success! Logged in as: <strong>${data.email}</strong></div>`;
        } else {
          statusDiv.innerHTML = '<div class="error">❌ Not logged in. Please sign in with Google first.</div>';
        }
        
      } catch (err) {
        console.error('Error:', err);
        statusDiv.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
        resultDiv.textContent = err.toString();
      }
    }
    
    // Auto-check on page load
    window.addEventListener('load', testAuth);
  </script>
</body>
</html>
