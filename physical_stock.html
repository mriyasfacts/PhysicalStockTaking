<!DOCTYPE html>
<html>
<head>
  <title>Google Auth Test</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 12px 24px; margin: 10px; cursor: pointer; border: none; border-radius: 6px; font-size: 16px; }
    .google-btn { background: #4285f4; color: white; }
    .test-btn { background: #34a853; color: white; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow: auto; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; margin: 20px 0; }
    .success { color: #0a7e3a; background: #e6f4ea; padding: 10px; border-radius: 5px; }
    .error { color: #a50e0e; background: #fce8e8; padding: 10px; border-radius: 5px; }
    .info { color: #0766a5; background: #e5f0fa; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🔐 Google Authentication Test</h1>
  <p>Hosted on: <strong>GitHub Pages</strong></p>
  
  <div class="card">
    <h3>Step 1: Sign in with Google</h3>
    <button class="google-btn" onclick="signInWithGoogle()">Sign in with Google</button>
    <p><small>Opens Google sign-in page in a new tab</small></p>
  </div>

  <div class="card">
    <h3>Step 2: Test Authentication</h3>
    <button class="test-btn" onclick="testAuth()">Test My Login Status</button>
    <p><small>After signing in, click here to check</small></p>
  </div>

  <div id="status"></div>
  <h3>Response:</h3>
  <pre id="result">Click test to check status</pre>

  <script>
    // IMPORTANT: Replace with your actual Apps Script URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxLR2tAbq38EmKusPp9hitVEpepMGF2tgJ3etY7ZHMqwNslMV1reKoO7QSRhYS1rRGtTQ/exec';
    
    function signInWithGoogle() {
      window.open('https://accounts.google.com/Login', '_blank');
      showStatus('info', 'Please sign in with Google in the new tab, then come back and click "Test My Login Status"');
    }
    
    function showStatus(type, message) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
    }
    
    async function testAuth() {
      const resultDiv = document.getElementById('result');
      
      showStatus('info', '⏳ Checking authentication...');
      resultDiv.textContent = 'Loading...';
      
      try {
        // Use JSONP approach (works with GitHub Pages)
        const data = await jsonpRequest(API_URL);
        console.log('Response:', data);
        
        resultDiv.textContent = JSON.stringify(data, null, 2);
        
        if (data.email) {
          showStatus('success', `✅ Success! Logged in as: <strong>${data.email}</strong>`);
        } else {
          showStatus('error', '❌ Not logged in. Please sign in with Google first.');
        }
        
      } catch (err) {
        console.error('Error:', err);
        showStatus('error', `❌ Error: ${err.message}`);
        resultDiv.textContent = err.toString();
      }
    }
    
    function jsonpRequest(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'callback_' + Date.now();
        const script = document.createElement('script');
        
        // Set timeout
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Request timeout - check if URL is correct'));
        }, 10000);
        
        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }
        
        // Define callback function
        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };
        
        // Handle errors
        script.onerror = function() {
          cleanup();
          reject(new Error('Failed to load script - check URL and CORS'));
        };
        
        // Append script to head
        script.src = url + '?callback=' + callbackName;
        document.head.appendChild(script);
      });
    }
    
    // Auto-check on page load
    window.addEventListener('load', testAuth);
  </script>
</body>
</html>
