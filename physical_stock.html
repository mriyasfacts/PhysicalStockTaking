<!DOCTYPE html>
<html>
<head>
  <title>Google Auth Test</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow: auto; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #e7f3ff; color: #004085; }
  </style>
</head>
<body>
  <h1>🔐 Google Authentication Test</h1>
  
  <div id="status" class="status info">Click the button to test authentication</div>
  
  <button onclick="testAuth()">Test Authentication</button>
  <button onclick="openDirectLink()" style="background: #34a853;">Open Direct Link</button>
  
  <h3>Response:</h3>
  <pre id="result">No data yet</pre>
  
  <hr>
  
  <h3>Instructions:</h3>
  <ol>
    <li>Click "Test Authentication" to check via fetch</li>
    <li>Click "Open Direct Link" to open the API directly in a new tab</li>
    <li>Check the browser console (F12) for errors</li>
  </ol>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxXN_WiWMP_xFkMSjUMhAX_zSNhzM_YzF3csZgYeJ0rTQcQyDtFu3uVurNeM-bV-wLosg/exec'; // Replace with your actual URL
    
    async function testAuth() {
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');
      
      statusDiv.className = 'status info';
      statusDiv.innerHTML = '⏳ Testing authentication...';
      resultDiv.textContent = 'Waiting for response...';
      
      try {
        console.log('Fetching:', API_URL);
        
        const response = await fetch(API_URL + '?t=' + Date.now(), {
          method: 'GET',
          mode: 'cors',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
          }
        });
        
        console.log('Response status:', response.status);
        console.log('Response headers:', [...response.headers.entries()]);
        
        const data = await response.json();
        console.log('Response data:', data);
        
        resultDiv.textContent = JSON.stringify(data, null, 2);
        
        if (data.email && data.email !== 'NO_EMAIL') {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `✅ Success! Logged in as: <strong>${data.email}</strong>`;
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = '❌ Not logged in with Google. Click "Open Direct Link" to sign in.';
        }
        
      } catch (err) {
        console.error('Fetch error:', err);
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `❌ Error: ${err.message}`;
        resultDiv.textContent = err.toString();
      }
    }
    
    function openDirectLink() {
      window.open(API_URL, '_blank');
    }
    
    // Auto-run test on page load
    window.addEventListener('load', testAuth);
  </script>
</body>
</html>
