

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Edit Physical Stock Taking</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,system-ui,sans-serif;
  background:#f3f4f6;color:#1f2937
}
.container{
  max-width:900px;
  margin:2.5rem auto;
  padding:0 1rem
}
h1{margin-bottom:1.5rem}
.card{
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding:1.5rem
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem
}
label{
  font-size:.75rem;
  color:#6b7280;
  text-transform:uppercase
}
input{
  width:100%;
  padding:.5rem;
  border:1px solid #d1d5db;
  border-radius:6px
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem
}
th,td{
  border:1px solid #e5e7eb;
  padding:.5rem;
  text-align:center
}
th{background:#f9fafb}
button{
  border:none;
  border-radius:6px;
  padding:.6rem 1.2rem;
  cursor:pointer
}
.add{background:#3b82f6;color:#fff;margin-top:1rem}
.save{background:#16a34a;color:#fff}
.delete{background:#dc2626;color:#fff}
.actions{
  display:flex;
  justify-content:space-between;
  margin-top:1.5rem
}
</style>
</head>

<body>
<div class="container">
  <h1>Edit Physical Stock Taking</h1>

  <div class="card">
    <input type="hidden" id="recordId" />

    <!-- HEADER -->
    <div class="grid">
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>Division</label>
        <input type="number" id="division">
      </div>
      <div>
        <label>Location</label>
        <input type="number" id="location">
      </div>
    </div>

    <!-- ITEMS -->
    <table id="itemsTable">
      <thead>
        <tr>
          <th>Item Code</th>
          <th>Unit</th>
          <th>Qty</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button class="add" onclick="addRow()">+ Add Item</button>

    <div class="actions">
      <button class="delete" onclick="deleteRecord()">Delete</button>
      <button class="save" onclick="updateRecord()">Update</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const API_URL =
  'https://script.google.com/macros/s/AKfycbwDz-TsYXXTH-5zy4s7oORdsxkYzzMM4_xn_bq1OUPtYogZPtVX0K9sBPWtcZ6BxkY9fA/exec';

/* ================= HELPERS ================= */
function addRow(code='', unit='', qty='') {
  document.querySelector('#itemsTable tbody')
    .insertAdjacentHTML('beforeend', `
      <tr>
        <td><input value="${code}"></td>
        <td><input value="${unit}"></td>
        <td><input type="number" value="${qty}"></td>
        <td><button onclick="this.closest('tr').remove()">✕</button></td>
      </tr>
    `);
}

function parseStock(str) {
  return str.replaceAll('),(', ')|(')
    .replaceAll('(', '')
    .replaceAll(')', '')
    .split('|')
    .map(s => s.split(','));
}

/* ================= LOAD RECORD ================= */
const params = new URLSearchParams(window.location.search);
const recordId = params.get('recordId') || '10004';

if (!recordId) {
  alert('Record ID missing');
  throw new Error('recordId not provided');
}

document.getElementById('recordId').value = recordId;

fetch(`${API_URL}?recordId=${recordId}`)
  .then(r => r.json())
  .then(res => {
    if (res.status !== 'success') {
      alert(res.message);
      return;
    }

    const d = res.data;

    document.getElementById('date').value = d.Text1;
    document.getElementById('division').value = d.Text2;
    document.getElementById('location').value = d.Text3;

    parseStock(d.Text4).forEach(([c,u,q]) => addRow(c,u,q));
  });

/* ================= UPDATE ================= */
function updateRecord() {
  const rows = [...document.querySelectorAll('#itemsTable tbody tr')];

  const stock = rows.map(r => {
    const i = r.querySelectorAll('input');
    return `(${i[0].value},${i[1].value},${i[2].value})`;
  }).join(',');

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'update',
      recordId,
      date: document.getElementById('date').value,
      division: document.getElementById('division').value,
      location: document.getElementById('location').value, 
      stock
    })
  })
  .then(r => r.json())
  .then(() => {
    alert('Updated successfully');
    window.location.href = 'index.html';
  });
}

/* ================= DELETE ================= */
function deleteRecord() {
  if (!confirm('Delete this record?')) return;

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'delete',
      recordId
    })
  })
  .then(r => r.json())
  .then(() => {
    alert('Deleted');
    window.location.href = 'index.html';
  });
}
</script>
</body>
</html>
