<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Physical Stock Taking</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,system-ui,sans-serif;
  background:#f3f4f6;color:#1f2937
}
.container{
  max-width:1100px;
  margin:2.5rem auto;
  padding:0 1rem
}
h1{margin-bottom:1.5rem}

/* CARD */
.card{
  background:#fff;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding:1.5rem
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem
}
label{
  font-size:.75rem;
  color:#6b7280;
  text-transform:uppercase;
  letter-spacing:.05em;
  display:block;
  margin-bottom:.25rem
}
input, select{
  width:100%;
  padding:.5rem;
  border:1px solid #d1d5db;
  border-radius:6px;
  font-size:.875rem
}
select{
  background:#fff;
  cursor:pointer
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem
}
th,td{
  border:1px solid #e5e7eb;
  padding:.5rem;
  text-align:center
}
th{background:#f9fafb}
td select, td input{
  margin:0;
  font-size:.875rem
}
button{
  border:none;border-radius:6px;
  padding:.6rem 1.2rem;
  cursor:pointer;
  font-size:.875rem
}
.add{
  background:#3b82f6;color:#fff;margin-top:1rem
}
.save{
  background:#16a34a;color:#fff;margin-top:1.5rem
}
.remove{
  background:#dc2626;color:#fff
}
.actions{text-align:right}
.loading{
  color:#6b7280;
  font-style:italic
}
</style>
</head>

<body>

<div class="container">
  <h1>New Physical Stock Taking</h1>

  <div class="card">

    <!-- HEADER FIELDS -->
    <div class="grid">
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>Division</label>
        <select id="division">
          <option value="">Loading...</option>
        </select>
      </div>
      <div>
        <label>Location</label>
        <select id="location">
          <option value="">Loading...</option>
        </select>
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <table id="itemsTable">
      <thead>
        <tr>
          <th>Item Code</th>
          <th>Description</th>
          <th>Unit</th>
          <th>Qty</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button class="add" onclick="addRow()">+ Add Item</button>

    <div class="actions">
      <button class="save" onclick="save()">Save Stock Taking</button>
    </div>

  </div>
</div>

<script>
const API_URL =
  'https://script.google.com/macros/s/AKfycbysC5giI3quVYgXZJZTBUB0SOdYXMYH8TVGzE2l9PpAd0i3sOkqBcJ0JWE0QmWFdS19rg/exec';

// Store configuration data with test data as fallback
window.configData = { 
  items: [],
  divisions: [],
  locations: []
};

// Load configurations on page load
window.addEventListener('DOMContentLoaded', loadConfigurations);

function loadConfigurations() {
  console.log('Starting to load configurations...');
  
  fetch(API_URL + '?action=get_config')
  .then(r => r.json())
  .then(j => {
    console.log('API Response:', j);
    
    if (j.status === 'success') {
      const config = j.data;
      
      // Set API data to window.configData
      window.configData.divisions = config.divisions || [];
      window.configData.locations = config.locations || [];
      window.configData.items = (config.items || []).map(item => ({
        code: String(item.code),
        description: item.description,
        Unit: item.Unit
      }));
      
      console.log('Final configData:', window.configData);
      populateDropdowns();
      addRow(); // Move here
    } else {
      console.error('API returned error:', j.message);
      populateDropdowns();
      addRow();
    }
  })
  .catch(err => {
    console.error('Fetch error:', err);
    populateDropdowns();
    addRow();
  });
}

function populateDropdowns() {
  // Populate Division dropdown
  const divisionSelect = document.getElementById('division');
  divisionSelect.innerHTML = '<option value="">Select Division</option>';
  configData.divisions.forEach(div => {
    divisionSelect.innerHTML += `<option value="${div}">${div}</option>`;
  });

  // Populate Location dropdown
  const locationSelect = document.getElementById('location');
  locationSelect.innerHTML = '<option value="">Select Location</option>';
  configData.locations.forEach(loc => {
    locationSelect.innerHTML += `<option value="${loc}">${loc}</option>`;
  });
}

function getItemsDropdown() {
  let html = '<option value="">Select Item</option>';
  if (configData.items && configData.items.length > 0) {
    configData.items.forEach(item => {
      const code = String(item.code); // Ensure code is string
      const display = `${code} - ${item.description || code}`;
      html += `<option value="${code}">${display}</option>`;
    });
  }
  return html;
}

function getUnitsForItem(itemCode) {
  let html = '<option value="">Select Unit</option>';
  
  // Find the item in configData
  const item = configData.items.find(i => i.code === itemCode);
  
  if (item && item.Unit) {
    // Split the Unit string by comma and create options
    const units = item.Unit.split(',').map(u => u.trim());
    units.forEach(unit => {
      html += `<option value="${unit}">${unit}</option>`;
    });
  }
  
  return html;
}

function onItemChange(selectElement) {
  const row = selectElement.closest('tr');
  const itemCode = String(selectElement.value); // Convert to string
  
  // Find the selected item (compare as strings)
  const item = configData.items.find(i => String(i.code) === itemCode);
  
  if (item) {
    // Fill description
    const descriptionInput = row.querySelector('.description');
    descriptionInput.value = item.description || '';
    
    // Update unit dropdown with item-specific units
    const unitSelect = row.querySelector('.unit');
    unitSelect.innerHTML = getUnitsForItem(itemCode);
  } else {
    // Clear description and unit if no item selected
    row.querySelector('.description').value = '';
    row.querySelector('.unit').innerHTML = '<option value="">Select Unit</option>';
  }
}

function addRow() {
  const tbody = document.querySelector('#itemsTable tbody');
  tbody.insertAdjacentHTML('beforeend', `
    <tr>
      <td><select class="item-code" onchange="onItemChange(this)">${getItemsDropdown()}</select></td>
      <td><input class="description" placeholder="Description" readonly></td>
      <td><select class="unit"><option value="">Select Unit</option></select></td>
      <td><input type="number" class="qty" min="0" step="0.01"></td>
      <td><button class="remove" onclick="this.closest('tr').remove()">✕</button></td>
    </tr>
  `);
}



function save() {
  const date = document.getElementById('date').value;
  const division = document.getElementById('division').value;
  const location = document.getElementById('location').value;

  const rows = [...document.querySelectorAll('#itemsTable tbody tr')];
  if (!date || !division || !location || !rows.length) {
    alert('Fill all fields');
    return;
  }

  const stock = rows.map(r => {
    const itemCode = r.querySelector('.item-code').value;
    const unit = r.querySelector('.unit').value;
    const qty = r.querySelector('.qty').value;
    
    if (!itemCode || !unit || !qty) {
      return null;
    }
    
    return `(${itemCode},${unit},${qty})`;
  }).filter(item => item !== null).join(',');

  if (!stock) {
    alert('Please fill in all item details');
    return;
  }

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      date,
      division,
      location,
      stock
    })
  })
  .then(r => r.json())
  .then(j => {
    if (j.status === 'success') {
      alert('Saved successfully');
      window.location.href = 'index.html';
    } else {
      alert(j.message);
    }
  });
}
</script>

</body>
</html>
