<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner - Item Lookup</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  padding:20px;
}

/* ===== LAYOUT ===== */
.wrapper{
  max-width:1000px;
  margin:auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  overflow:hidden;
}

.header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  padding:25px;
  text-align:center;
}

.main{
  display:flex;
  gap:20px;
  padding:25px;
}

/* ===== LEFT : ITEM DETAILS ===== */
.left{
  flex:2;
}

/* ===== RIGHT : SCANNER ===== */
.right{
  flex:1;
  border-left:2px dashed #e5e7eb;
  padding-left:20px;
}

@media(max-width:768px){
  .main{flex-direction:column}
  .right{border-left:none;padding-left:0}
}

/* ===== SCANNER ===== */
.scanner-input{
  position:relative;
  margin-bottom:15px;
}

.scanner-input input{
  width:100%;
  padding:16px;
  border:2px solid #e5e7eb;
  border-radius:12px;
  font-size:16px;
}

.scanner-input label{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#9ca3af;
  pointer-events:none;
}

.scanner-input input:focus+label,
.scanner-input input:not(:placeholder-shown)+label{
  top:-8px;
  font-size:12px;
  background:#fff;
  padding:0 5px;
  color:#4f46e5;
}

.scan-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

/* ===== STATES ===== */
.hidden{display:none}

.loading,
.error-message,
.not-found{
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}

.loading{color:#6b7280}
.error-message{background:#fee2e2;color:#dc2626}
.not-found{background:#fef3c7;color:#92400e}

/* ===== ITEM DETAILS ===== */
.item-details{
  background:#f8fafc;
  border-radius:12px;
  padding:20px;
  border:2px solid #e5e7eb;
}

.item-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.item-code{
  background:#4f46e5;
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
}

.detail-row{
  display:flex;
  margin-bottom:10px;
}

.detail-label{
  width:120px;
  color:#6b7280;
  font-weight:600;
}

.price{
  font-size:30px;
  font-weight:800;
  color:#059669;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h1>📦 Item Lookup</h1>
    <p>Scan barcode to get item details</p>
  </div>

  <div class="main">

    <!-- LEFT -->
    <div class="left">

      <div id="loading" class="loading hidden">Searching item...</div>
      <div id="error" class="error-message hidden"></div>

      <div id="notFound" class="not-found hidden">
        ⚠️ Item Not Found
      </div>

      <div id="itemDetails" class="item-details hidden">
        <div class="item-header">
          <h2 id="itemDescription">-</h2>
          <div class="item-code" id="itemCode">-</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Item Code</div>
          <div id="itemCodeFull">-</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Unit</div>
          <div id="itemUnit">-</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Price</div>
          <div class="price" id="itemPrice">-</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">Barcode</div>
          <div id="itemBarcode">-</div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <h3 style="margin-bottom:10px">📷 Barcode Scanner</h3>

      <div class="scanner-input">
        <input id="barcodeInput" placeholder=" " autocomplete="off">
        <label>Enter Barcode</label>
      </div>

      <button class="scan-btn" onclick="lookupItem()">Search</button>
    </div>

  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbybKCpHN6MH-Sg9waB7_hCIJeNbzc57w03DvB-284pObtugelX5moWu1sXidOS3bZZUVA/exec';

const barcodeInput = document.getElementById('barcodeInput');
const loading = document.getElementById('loading');
const errorDiv = document.getElementById('error');
const notFoundDiv = document.getElementById('notFound');
const itemDetails = document.getElementById('itemDetails');

const itemDescription = document.getElementById('itemDescription');
const itemCode = document.getElementById('itemCode');
const itemCodeFull = document.getElementById('itemCodeFull');
const itemUnit = document.getElementById('itemUnit');
const itemPrice = document.getElementById('itemPrice');
const itemBarcode = document.getElementById('itemBarcode');

function clearAll(){
  loading.classList.add('hidden');
  errorDiv.classList.add('hidden');
  notFoundDiv.classList.add('hidden');
  itemDetails.classList.add('hidden');
}

async function lookupItem(){
  const barcode = barcodeInput.value.replace(/\D/g,'');
  if(!barcode){ return; }

  clearAll();
  loading.classList.remove('hidden');

  try{
    const res = await fetch(`${API_URL}?action=get_item_by_barcode&barcode=${barcode}`);
    const data = await res.json();

    clearAll();

    if(data.status === 'success'){
      const i = data.data;
      itemDescription.textContent = i.description;
      itemCode.textContent = i.code;
      itemCodeFull.textContent = i.code;
      itemUnit.textContent = i.unit;
      itemPrice.textContent = `₹ ${i.price || 'N/A'}`;
      itemBarcode.textContent = barcode;

      itemDetails.classList.remove('hidden');
      barcodeInput.value = '';
    }else{
      notFoundDiv.classList.remove('hidden');
    }

  }catch(e){
    clearAll();
    errorDiv.textContent = e.message;
    errorDiv.classList.remove('hidden');
  }
}

barcodeInput.addEventListener('keydown',e=>{
  if(e.key==='Enter') lookupItem();
});
</script>

</body>
</html>
